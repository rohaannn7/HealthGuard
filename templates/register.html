<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Create Account | Health Guard</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            background: #f4f8fc;
            color: #172b4d;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 25px;
        }

        .container {
            width: 100%;
            max-width: 460px;
            background: white;
            padding: 38px;
            border-radius: 16px;
            box-shadow: 0 8px 30px rgba(0, 0, 0, 0.07);
        }

        .logo {
            text-align: center;
            font-size: 28px;
            font-weight: bold;
            color: #087f8c;
            margin-bottom: 12px;
        }

        h1 {
            text-align: center;
            font-size: 27px;
            margin-bottom: 10px;
        }

        .subtitle {
            text-align: center;
            color: #64748b;
            margin-bottom: 28px;
            line-height: 1.5;
        }

        label {
            display: block;
            font-weight: bold;
            margin-bottom: 8px;
        }

        input {
            width: 100%;
            padding: 13px;
            border: 1px solid #cbd5e1;
            border-radius: 8px;
            font-size: 15px;
            margin-bottom: 19px;
        }

        input:focus {
            outline: 2px solid #087f8c;
            border-color: #087f8c;
        }

        button {
            width: 100%;
            padding: 14px;
            border: none;
            border-radius: 8px;
            background: #087f8c;
            color: white;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
        }

        button:hover {
            background: #066570;
        }

        .message {
            padding: 12px;
            margin-bottom: 18px;
            border-radius: 7px;
            line-height: 1.5;
            font-size: 14px;
        }

        .danger {
            background: #fee2e2;
            color: #991b1b;
        }

        .success {
            background: #dcfce7;
            color: #166534;
        }

        .warning {
            background: #fef3c7;
            color: #92400e;
        }

        .bottom {
            text-align: center;
            margin-top: 22px;
            line-height: 1.8;
            color: #64748b;
        }

        a {
            color: #087f8c;
            font-weight: bold;
            text-decoration: none;
        }

        a:hover {
            text-decoration: underline;
        }
    </style>
</head>

<body>
    <main class="container">

        <div class="logo">🩺 Health Guard</div>

        <h1>Create Your Account</h1>

        <p class="subtitle">
            Register to access the Health Guard assessment modules.
        </p>

        {% with messages = get_flashed_messages(with_categories=true) %}
            {% for category, message in messages %}
                <div class="message {{ category }}" role="alert">
                    {{ message }}
                </div>
            {% endfor %}
        {% endwith %}

        <form method="POST" action="{{ url_for('register') }}">
            <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
            <label for="name">Full Name</label>
            <input
                type="text"
                id="name"
                name="name"
                maxlength="100"
                autocomplete="name"
                placeholder="Enter your full name"
                required
            >

            <label for="email">Email Address</label>
            <input
                type="email"
                id="email"
                name="email"
                maxlength="254"
                autocomplete="email"
                placeholder="Enter your email"
                required
            >

            <label for="password">Password</label>
            <input
                type="password"
                id="password"
                name="password"
                minlength="8"
                maxlength="128"
                autocomplete="new-password"
                placeholder="At least 8 characters, including a letter and number"
                required
            >

            <label for="confirm_password">Confirm Password</label>
            <input
                type="password"
                id="confirm_password"
                name="confirm_password"
                minlength="8"
                maxlength="128"
                autocomplete="new-password"
                placeholder="Re-enter your password"
                required
            >

            <button type="submit">Create Account</button>

        </form>

        <div class="bottom">
            Already have an account?
            <a href="{{ url_for('login') }}">Log in</a>
            <br>
            <a href="{{ url_for('home') }}">← Back to Home</a>
        </div>

    </main>
</body>
</html>
